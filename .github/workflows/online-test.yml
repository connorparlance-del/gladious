name: Prueba online real
on:
  push:
    branches: [ci-online]
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Dos navegadores contra la web publicada (PeerJS Cloud)
        run: python -u tests/online_live.py https://connorparlance-del.github.io/gladious/
