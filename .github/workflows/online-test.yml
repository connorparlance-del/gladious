name: Prueba online real
on:
  push:
    branches: [ci-online]
permissions:
  contents: write
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Dos navegadores contra la web publicada (PeerJS Cloud)
        run: python -u tests/online_live.py https://connorparlance-del.github.io/gladious/ 2>&1 | tee results.txt; echo "exit=${PIPESTATUS[0]}" >> results.txt
      - name: Guardar resultados en la rama ci-results
        if: always()
        run: |
          mkdir -p /tmp/r && cp results.txt /tmp/r/ || echo "sin resultados" > /tmp/r/results.txt
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-results && git rm -rf -q . && cp /tmp/r/results.txt . && git add results.txt
          git commit -q -m "resultados ${GITHUB_RUN_ID}" && git push -f origin ci-results
